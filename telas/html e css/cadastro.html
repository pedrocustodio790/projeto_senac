<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Leilão</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <!-- Adicionada uma fonte muito mais elegante e moderna (Inter) -->
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-title">LEILÃO</div>
    </nav>

    <div class="cadastro-container">
        <form class="cadastro-form">
            
            <!-- Textos Centralizados -->
            <div class="center-text">
                <h2>Criar Conta</h2>
                <p class="subtitle">Campos com * são obrigatórios</p>
            </div>

            <!-- Informações Pessoais -->
            <div class="form-group">
                <label for="nome">Nome completo *</label>
                <input type="text" id="nome" required placeholder="Digite seu nome completo">
            </div>

            <div class="form-group-row">
                <div class="form-group">
                    <label for="usuario">Nome de usuário</label>
                    <input type="text" id="usuario" placeholder="Escolha um usuário">
                </div>
                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00">
                </div>
            </div>

            <div class="form-group-row">
                <div class="form-group">
                    <label for="telefone">Telefone *</label>
                    <input type="tel" id="telefone" required placeholder="(00) 00000-0000">
                </div>
                <div class="form-group">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" required placeholder="seu@email.com">
                </div>
            </div>

            <div class="form-group">
                <label for="senha">Senha *</label>
                <input type="password" id="senha" required placeholder="Crie uma senha forte">
            </div>

            <!-- Endereço Completo -->
            <fieldset>
                <legend>Endereço completo *</legend>

                <div class="form-group-row">
                    <div class="form-group flex-2">
                        <label for="rua">Rua e Número</label>
                        <input type="text" id="rua" required placeholder="Ex: Av. Paulista, 1230">
                    </div>
                    <div class="form-group flex-1">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" required placeholder="00000-000">
                    </div>
                </div>

                <div class="form-group-row">
                    <div class="form-group">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" required placeholder="Sua cidade">
                    </div>
                    <div class="form-group">
                        <label for="estado">Estado</label>
                        <input type="text" id="estado" required placeholder="Seu estado">
                    </div>
                </div>
            </fieldset>

            <!-- Termos e Botão -->
            <div class="form-checkbox">
                <input type="checkbox" id="termos" required>
                <label for="termos">Concordo com os termos e condições do site</label>
            </div>

            <button type="submit" class="btn-finalizar">Finalizar Cadastro</button>

        </form>
    </div>

</body>
</html>
