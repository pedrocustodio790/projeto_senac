<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Leilão</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-title">leilao</div>
    </nav>

    <div class="cadastro-container">
        <form class="cadastro-form">
            
            <h2>Criar Conta</h2>
            <p class="subtitle">Campos com * são obrigatórios</p>

            <!-- Informações Pessoais -->
            <div class="form-group">
                <label for="nome">Nome completo:*</label>
                <input type="text" id="nome" required placeholder="Digite seu nome completo">
            </div>

            <div class="form-group-row">
                <div class="form-group">
                    <label for="usuario">Nome de usuário:</label>
                    <input type="text" id="usuario" placeholder="Escolha um usuário">
                </div>
                <div class="form-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00">
                </div>
            </div>

            <div class="form-group-row">
                <div class="form-group">
                    <label for="telefone">Telefone:*</label>
                    <input type="tel" id="telefone" required placeholder="(00) 00000-0000">
                </div>
                <div class="form-group">
                    <label for="email">E-mail:*</label>
                    <input type="email" id="email" required placeholder="seu@email.com">
                </div>
            </div>

            <div class="form-group">
                <label for="senha">Senha:*</label>
                <input type="password" id="senha" required placeholder="Crie uma senha forte">
            </div>

            <!-- Dados do Cartão -->
            <fieldset>
                <legend>Dados do Cartão</legend>
                
                <div class="form-group">
                    <label for="num-cartao">Número do Cartão:</label>
                    <input type="text" id="num-cartao" placeholder="0000 0000 0000 0000">
                </div>

                <div class="form-group">
                    <label for="nome-cartao">Nome no Cartão:</label>
                    <input type="text" id="nome-cartao" placeholder="Como está impresso no cartão">
                </div>

                <div class="form-group-row">
                    <div class="form-group">
                        <label for="validade">Data de validade:</label>
                        <input type="text" id="validade" placeholder="MM/AA">
                    </div>
                    <div class="form-group">
                        <label for="cvv">CVV:</label>
                        <input type="text" id="cvv" placeholder="000">
                    </div>
                </div>
            </fieldset>

            <!-- Endereço Completo -->
            <fieldset>
                <legend>Endereço completo:*</legend>

                <div class="form-group-row">
                    <div class="form-group flex-2">
                        <label for="rua">Rua e Número:</label>
                        <input type="text" id="rua" required placeholder="Ex: Av. Paulista, 1230">
                    </div>
                    <div class="form-group flex-1">
                        <label for="cep">CEP:</label>
                        <input type="text" id="cep" required placeholder="00000-000">
                    </div>
                </div>

                <div class="form-group-row">
                    <div class="form-group">
                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" required placeholder="Sua cidade">
                    </div>
                    <div class="form-group">
                        <label for="estado">Estado:</label>
                        <input type="text" id="estado" required placeholder="Seu estado">
                    </div>
                </div>
            </fieldset>

            <!-- Termos e Botão -->
            <div class="form-checkbox">
                <input type="checkbox" id="termos" required>
                <label for="termos">Concordo com os termos e condições do site</label>
            </div>

            <button type="submit" class="btn-entrar">Entrar</button>

        </form>
    </div>

</body>
</html>
